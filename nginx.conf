# Nginx interno del contenedor. SIN TLS propio a proposito: el Nginx del
# host (innovaclub-infra) es quien termina TLS y reenvia aqui por HTTP plano,
# ya con el prefijo /cucuta recortado -- ver innovaclub-infra/nginx/.
server {
    listen 80;
    server_name _;

    # Sonda del healthcheck de Docker.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: el unico archivo real es index.html. Sin este try_files, entrar
    # directo a /ruleta o recargar estando ahi devuelve 404 y el bundle de
    # React nunca llega a cargar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre -- cache para siempre.
    # index.html NO: es el que apunta a los hashes nuevos tras cada deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El front se compila con VITE_API_URL=/cucuta, asi que pide
    # /cucuta/api/... -- el Nginx del host recorta el /cucuta antes de
    # reenviar aqui, asi que a este contenedor le sigue llegando /api/...
    # tal cual siempre. `api` es el nombre del servicio en docker-compose.yml.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pasa el valor real que puso el Nginx del host (http o https) en
        # vez de sobreescribirlo: $scheme aqui adentro SIEMPRE es "http"
        # (el Nginx del host habla con este contenedor por loopback plano),
        # asi que usar $scheme directo le mentiria a Express en cuanto haya
        # TLS de verdad en el host -- creeria que todo llega sin cifrar.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # La API responde con Set-Cookie (sesion y cookie de visitante
        # anonimo); sin pasar la cabecera Cookie de ida no habria sesion.
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
    }
}
