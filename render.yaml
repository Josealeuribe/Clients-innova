# Configuracion del Static Site en Render.
#
# La razon de existir de este archivo es la ultima seccion (`routes`).
#
# Esta app es una SPA: el servidor solo tiene un archivo real, /index.html, y
# es JavaScript en el navegador el que decide que vista mostrar segun
# window.location.pathname (ver src/shared/types/navigation.ts). Cuando alguien
# entra directo a https://.../ruleta o recarga estando ahi, el navegador le
# pide al host el archivo "/ruleta" — que no existe en dist/ — y el host
# responde su 404 por defecto ("Not Found" sobre pantalla en blanco/negro
# segun el tema del navegador). El bundle de React nunca llega a cargarse, asi
# que la app no tiene forma de reaccionar.
#
# La regla de rewrite hace que el host sirva el contenido de /index.html ante
# CUALQUIER ruta sin cambiar la URL en la barra de direcciones. Asi el bundle
# carga, lee el pathname y monta la vista correcta: recargar en /ruleta
# devuelve /ruleta.
#
# OJO: no es un redirect. Un redirect cambiaria la URL a "/" y el usuario
# perderia la vista en la que estaba, que es justo lo que se quiere evitar.
#
# IMPORTANTE al sincronizar este Blueprint: `name` debe coincidir EXACTO con
# el nombre del Static Site que ya existe en el dashboard de Render. Si no
# coincide, Render crea un servicio nuevo en vez de actualizar el actual.
services:
  - type: web
    runtime: static
    name: clients-innova
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
